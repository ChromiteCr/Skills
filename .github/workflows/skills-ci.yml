name: Skills CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR code runs only on an ephemeral hosted runner with no write token or secrets.
# This workflow is evidence, not merge authority: a trusted external controller
# must enforce auto/* scope, semantic test review and exact-SHA check provenance.
permissions:
  contents: read

jobs:
  checks:
    name: Required validation
    # Existing photography tests exercise Apple's Display P3 ICC profile.
    # Run on a hosted Mac rather than returning a green Linux skip.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      # Official release commit SHAs verified against GitHub's public ref API.
      - name: Check out the exact event revision (PR test-merge or pushed main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up deterministic Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          check-latest: false
      - name: Install pinned test imports
        run: |
          python -m pip install --only-binary=:all: -r scripts/pr_automation/requirements-ci.txt
      - name: Verify Apple test prerequisites and install pinned open test font
        run: |
          # Changes remain inside this disposable hosted runner, never the user's Mac.
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request
          required = [
              Path('/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'),
              Path('/System/Library/ColorSync/Profiles/Display P3.icc'),
              Path('/System/Library/Fonts/SFNS.ttf'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Required hosted macOS prerequisites missing: ' + repr(missing))
          base = 'https://raw.githubusercontent.com/google/fonts/0b58fb370093f9a9f4ff785d94405710b79de67c/ofl/inter/'
          assets = [
              ('Inter%5Bopsz,wght%5D.ttf', 'Inter.ttf', '29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031'),
              ('OFL.txt', 'Inter-OFL.txt', '5b9321a4298cfeb6b34354164a1c3afc3db114569984c502b9b35d988fd58c57'),
          ]
          destination = Path.home() / 'Library/Fonts'
          destination.mkdir(parents=True, exist_ok=True)
          for remote, filename, expected in assets:
              with urllib.request.urlopen(base + remote, timeout=30) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('Pinned test-font checksum mismatch: ' + filename)
              target = destination / filename
              if target.exists() and target.read_bytes() != data:
                  raise SystemExit('Existing test font differs; refusing overwrite: ' + filename)
              target.write_bytes(data)
          PY
      - name: Validate structure, affected skills and PR automation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Fail closed for missing history; never silently replace it with no tests.
          test -n "$BASE_SHA"
          python scripts/pr_automation/ci.py --mode ci --base "$BASE_SHA" --branch "$HEAD_BRANCH"

  gate:
    name: Skills gate
    # Do not add path filters or success-only conditions to this aggregate job.
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every expected job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = {"checks"}
          if not needs or set(needs) != expected:
              sys.exit("Missing or unexpected required jobs; empty success is forbidden")
          failed = {name: value.get("result") for name, value in needs.items()
                    if value.get("result") != "success"}
          if failed:
              sys.exit("Required jobs failed, skipped, or cancelled: " + repr(failed))
          print("All required jobs succeeded for this event revision.")
          PY
